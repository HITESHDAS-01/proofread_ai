name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify sources compile
        run: python -m py_compile config.py llm.py history.py ui.py main.py updater.py license.py generate_key.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: pyinstaller --clean --noconfirm AI_Proofreader.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Proofreader_Windows
          path: |
            dist/AI_Proofreader.exe
            LICENSE
            PRIVACY.md
          retention-days: 30

      - name: Create release (source repo)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AI_Proofreader.exe
            LICENSE
            PRIVACY.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to public releases repo
        if: startsWith(github.ref, 'refs/tags/') && env.RELEASES_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: HITESHDAS-01/ai-proofreader-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          files: |
            dist/AI_Proofreader.exe
            LICENSE
            PRIVACY.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ env.RELEASES_TOKEN }}
